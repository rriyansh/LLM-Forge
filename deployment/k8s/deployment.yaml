apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-forge
  labels: { app: llm-forge }
spec:
  replicas: 1
  selector:
    matchLabels: { app: llm-forge }
  template:
    metadata:
      labels: { app: llm-forge }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: ghcr.io/yourorg/llm-forge:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000, name: http }]
          envFrom:
            - secretRef: { name: llm-forge-secrets }
            - configMapRef: { name: llm-forge-config }
          resources:
            limits:
              nvidia.com/gpu: 1
              memory: "32Gi"
              cpu: "8"
            requests:
              memory: "24Gi"
              cpu: "4"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /app/.cache }
          readinessProbe:
            httpGet: { path: /health/ready, port: 8000 }
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 4
          livenessProbe:
            httpGet: { path: /health/live, port: 8000 }
            initialDelaySeconds: 60
            periodSeconds: 30
          startupProbe:
            httpGet: { path: /health/ready, port: 8000 }
            failureThreshold: 40
            periodSeconds: 10
          lifecycle:
            preStop:
              exec: { command: ["sleep", "10"] }
      terminationGracePeriodSeconds: 60
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: cache, emptyDir: {} }
