apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: llm-forge-serve-hpa
  namespace: llm-forge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: llm-forge-serve
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: nvidia_com_gpu_utilization
        target:
          type: Utilization
          averageUtilization: 70
