apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llm-forge
  namespace: llm-forge
spec:
  podSelector:
    matchLabels: { app: llm-forge }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { name: ingress-nginx }
        - namespaceSelector:
            matchLabels: { name: monitoring }
      ports:
        - { protocol: TCP, port: 8000 }
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - { protocol: TCP, port: 53 }
        - { protocol: UDP, port: 53 }
    - to:
        - namespaceSelector:
            matchLabels: { name: llm-forge }
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 6379 }
