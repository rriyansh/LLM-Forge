apiVersion: v1
kind: Service
metadata:
  name: {{ include "llm-forge.fullname" . }}
  labels: {{- include "llm-forge.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      name: http
  selector:
    app.kubernetes.io/name: {{ include "llm-forge.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
