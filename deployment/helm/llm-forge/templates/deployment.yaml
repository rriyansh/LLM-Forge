apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llm-forge.fullname" . }}
  labels: {{- include "llm-forge.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "llm-forge.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "llm-forge.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      serviceAccountName: {{ include "llm-forge.fullname" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: 8000, name: http }]
          envFrom:
            - secretRef: { name: {{ .Values.secrets.existingSecret }} }
          env:
            {{- range $k, $v := .Values.env }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- if .Values.persistence.enabled }}
            - { name: models, mountPath: /models, readOnly: true }
            {{- end }}
          readinessProbe:
            httpGet: { path: /health/ready, port: 8000 }
            initialDelaySeconds: 120
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /health/live, port: 8000 }
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - { name: tmp, emptyDir: {} }
        {{- if .Values.persistence.enabled }}
        - name: models
          persistentVolumeClaim: { claimName: {{ include "llm-forge.fullname" . }}-models }
        {{- end }}
