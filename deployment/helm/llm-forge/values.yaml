replicaCount: 1

image:
  repository: ghcr.io/rriyansh/llm-forge-serve
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 80
  targetPort: 8000

resources:
  limits:
    nvidia.com/gpu: 1
    memory: 32Gi
  requests:
    nvidia.com/gpu: 1
    memory: 16Gi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
  averageUtilization: 70

env:
  apiKey:
    valueFrom:
      secretKeyRef:
        name: llm-forge-secrets
        key: api-key
  hfToken:
    valueFrom:
      secretKeyRef:
        name: llm-forge-secrets
        key: hf-token

ingress:
  enabled: false
