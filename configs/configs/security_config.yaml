auth:
  jwt_algorithm: HS256
  access_ttl_seconds: 3600
  refresh_ttl_seconds: 604800
  issuer: "llm-forge"
  audience: "llm-forge-api"

rbac:
  roles:
    admin:
      scopes: ["*"]
    developer:
      scopes: ["generate", "chat", "models:list", "metrics:read"]
    readonly:
      scopes: ["models:list", "health"]
    service:
      scopes: ["generate", "chat", "metrics:write"]

quotas:
  default:
    requests_per_day: 10000
    tokens_per_day: 1000000
  premium:
    requests_per_day: 100000
    tokens_per_day: 10000000

filters:
  pii:
    enabled: true
    entities: ["EMAIL_ADDRESS", "PHONE_NUMBER", "CREDIT_CARD", "PERSON", "US_SSN", "IBAN_CODE"]
  toxicity:
    enabled: true
    threshold: 0.8
  injection:
    enabled: true
    patterns:
      - "(?i)ignore\\s+(all\\s+)?(previous|above)\\s+instructions"
      - "(?i)disregard\\s+the\\s+(system|previous)\\s+prompt"
      - "(?i)reveal\\s+(your\\s+)?(system\\s+prompt|instructions)"
      - "(?i)you\\s+are\\s+now\\s+(a|an|the)"
