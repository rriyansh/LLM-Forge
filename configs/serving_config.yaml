# vLLM engine settings for production inference
model:
  model: /models/llama-3-8b
  trust_remote_code: true
  dtype: auto

engine:
  max_model_len: 4096
  gpu_memory_utilization: 0.90
  tensor_parallel_size: 1
  pipeline_parallel_size: 1
  swap_space: 4
  max_num_seqs: 256
  max_num_batched_tokens: 4096
  enable_prefix_caching: true

sampling:
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  max_tokens: 512
  repetition_penalty: 1.1

server:
  host: 0.0.0.0
  port: 8000
  workers: 1
  api_key: ${API_KEY}
