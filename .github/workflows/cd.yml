name: CD

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "configs/**"
      - "docker/**"
      - "deployment/**"

jobs:
  train-and-deploy:
    runs-on: self-hosted
    needs: []
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model (QLoRA)
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          WANDB_PROJECT=llm-forge python -m src.models.qlora_trainer \
            --config configs/training_config.yaml

      - name: Merge LoRA adapter
        run: |
          python -m src.models.merge_adapter --config configs/training_config.yaml

      - name: Evaluate model
        run: |
          python -m src.evaluation.evaluate --config configs/training_config.yaml

      - name: Build and push serving image
        env:
          REGISTRY: ${{ secrets.REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f docker/Dockerfile.serve \
            -t ${{ REGISTRY }}/llm-forge-serve:${IMAGE_TAG} .
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ REGISTRY }} -u ${{ secrets.REGISTRY_USER }} --password-stdin
          docker push ${{ REGISTRY }}/llm-forge-serve:${IMAGE_TAG}

      - name: Deploy to Kubernetes
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          echo "${KUBE_CONFIG_DATA}" | base64 -d > $HOME/.kube/config
          kubectl apply -f deployment/k8s/configmap.yaml
          kubectl apply -f deployment/k8s/deployment.yaml
          kubectl apply -f deployment/k8s/service.yaml
          kubectl apply -f deployment/k8s/hpa.yaml
          kubectl rollout status deployment/llm-forge-serve -n llm-forge --timeout=300s
