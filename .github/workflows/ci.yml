name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    services:
      registry:
        image: ghcr.io/rriyansh/llm-forge:ci
        options: >-
          --health-cmd "python -c 'import torch'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black ruff pytest pytest-cov

      - name: Lint with ruff
        run: ruff check src tests scripts

      - name: Check formatting with black
        run: black --check src tests scripts

      - name: Run test suite
        run: pytest tests -v --cov=src --cov-report=term-missing

      - name: Build Docker images
        run: |
          docker build -f docker/Dockerfile.train -t llm-forge-train:ci .
          docker build -f docker/Dockerfile.serve -t llm-forge-serve:ci .
