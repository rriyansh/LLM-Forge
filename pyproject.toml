[project]
name = "llm-forge"
version = "1.0.0"
description = "Production-grade LLM fine-tuning and serving pipeline"
requires-python = ">=3.10"
authors = [{ name = "LLM-Forge Team" }]
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "N", "S", "B", "A", "C4", "UP"]
ignore = ["S101"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/__init__.py"]
