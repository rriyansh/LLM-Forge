[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-forge"
version = "2.0.0"
description = "Production-grade, security-hardened LLM fine-tuning and serving pipeline"
requires-python = ">=3.11"
authors = [{ name = "LLM-Forge Team", email = "team@llmforge.dev" }]
license = { text = "MIT" }
readme = "README.md"

[project.scripts]
llm-forge = "src.serving.app:app"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
select = ["E", "F", "W", "I", "N", "S", "B", "A", "C4", "UP", "ASYNC", "T20", "RET"]
ignore = ["S101", "S104", "B008", "C901"]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"scripts/*" = ["T20"]
"docs/*" = ["S"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_generics = true
ignore_missing_imports = true
exclude = ["tests/*", "scripts/*"]

[[tool.mypy.overrides]]
module = ["bitsandbytes.*", "vllm.*", "trl.*", "presidio_analyzer.*", "presidio_anonymizer.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q --strict-markers --disable-warnings"
markers = ["integration: end-to-end tests", "gpu: requires GPU"]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["tests/*", "*/__init__.py", "src/db/migrations/*"]

[tool.coverage.report]
fail_under = 70
