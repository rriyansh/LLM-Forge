[project]
name = "llm-forge"
version = "0.1.0"
description = "Production-ready LLM fine-tuning and serving framework with QLoRA, PEFT, TRL, vLLM and FastAPI."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "LLM-Forge" }]
license = { text = "MIT" }
keywords = ["llm", "qlora", "peft", "trl", "vllm", "fastapi", "fine-tuning", "serving"]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing"
