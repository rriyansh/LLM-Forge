global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: llm-forge
    metrics_path: /metrics
    static_configs:
      - targets: ["llm-forge:8000"]
  - job_name: vllm-engine
    static_configs:
      - targets: ["llm-forge:8001"]

rule_files:
  - "/etc/prometheus/alert_rules.yml"
